name: memory-2026

on:
  push:
    branches: [develop]

jobs:
  # 4.1 — TEST : exécuter "file" sur tous les JPG/JPEG
   test-memory-2026:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run "file" on JPGs via Debian (inside Docker)
        shell: powershell
        run: |
          # Chemin du repo pour Docker (slashes Unix)
          $work = $env:GITHUB_WORKSPACE -replace '\\','/'

          # Lance Debian et exécute 'file' sur tous les JPG/JPEG
          docker run --rm --mount "type=bind,src=$work,dst=/work" -w /work debian:stable-slim bash -lc @'
            set -e
            apt-get update >/dev/null
            apt-get install -y file findutils >/dev/null
            count=$(find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) | wc -l)
            if [ "$count" -eq 0 ]; then echo "Aucun .jpg/.jpeg"; exit 0; fi
            find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -print0 | xargs -0 file
          '@


  # 4.2 — BUILD : construire l'image <username>/memory-2026:latest
  build-memory-2026:
    runs-on: self-hosted
    needs: test-memory-2026
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t $env:DOCKERHUB_USERNAME/memory-2026:latest .

  # 4.3 — PUSH : pousser sur Docker Hub
  push-memory-2026:
    runs-on: self-hosted
    needs: build-memory-2026
    steps:
      - name: Docker login
        run: |
          "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026:latest

  # 4.4 — DEPLOY : SSH vers TA machine, pull et run en 80:80
  deploy-memory-2026:
    runs-on: self-hosted
    needs: push-memory-2026
    steps:
      - name: Setup SSH key (Windows)
        shell: powershell
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force "$HOME\.ssh" | Out-Null
          Set-Content -Path "$HOME\.ssh\id_rsa" -Value $env:SSH_PRIVATE_KEY -NoNewline
          icacls "$HOME\.ssh\id_rsa" /inheritance:r /grant:r "$env:USERNAME:(R)" | Out-Null
      - name: Deploy to target via SSH
        shell: powershell
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/memory-2026:latest"
          # $null doit rester côté machine distante → on échappe $ en `$
          $remote = "docker pull $image; docker stop memory-2026 *> `$null; docker rm memory-2026 *> `$null; docker run -d --name memory-2026 -p 80:80 $image"
          ssh -o StrictHostKeyChecking=no "$env:SSH_USER@$env:SSH_HOST" "$remote"
