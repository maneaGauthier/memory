name: memory-2026

on:
  push:
    branches: [develop]

jobs:
  # 4.1 - Test: exécuter "file" sur les JPG
  # (on utilise un conteneur Debian pour avoir l'outil 'file' même sous Windows)
  test-memory-2026:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run "file" on JPGs via Debian
        shell: bash
        run: |
          docker run --rm -v "$PWD":/work -w /work debian:stable-slim bash -lc '
            apt-get update >/dev/null && apt-get install -y file >/dev/null
            shopt -s nullglob
            files=($(git ls-files "*.jpg" "*.jpeg"))
            if [ ${#files[@]} -eq 0 ]; then
              echo "Aucun .jpg/.jpeg"; exit 0
            fi
            for f in "${files[@]}"; do
              echo "==> $f"
              file "$f"
            done
          '

  # 4.2 - Build: construire l'image <username>/memory-2026
  build-memory-2026:
    runs-on: [self-hosted, Windows, X64]
    needs: test-memory-2026
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026:latest .

  # 4.3 - Push: pousser sur Docker Hub avec tes identifiants
  push-memory-2026:
    runs-on: [self-hosted, Windows, X64]
    needs: build-memory-2026
    steps:
      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026:latest

  # 4.4 - Deploy: SSH sur TA machine (Windows local), pull & run en 80:80
  deploy-memory-2026:
    runs-on: [self-hosted, Windows, X64]
    needs: push-memory-2026
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy to local Windows (127.0.0.1)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $env:SSH_USER@$env:SSH_HOST "docker pull $env:DOCKERHUB_USERNAME/memory-2026:latest; docker stop memory-2026 2>`$null; docker rm memory-2026 2>`$null; docker run -d --name memory-2026 -p 80:80 $env:DOCKERHUB_USERNAME/memory-2026:latest"
