name: memory-2026

on:
  push:
    branches: [develop]

jobs:
  # 4.1 — TEST : exécuter "file" sur tous les JPG/JPEG
    test-memory-2026:
    name: Test Memory 2026
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Test all JPEG files
        run: file --mime-type ./html/**/*.jpg | grep -v image/jpeg && exit 1 || exit 0
  # 4.2 — BUILD : construire l'image <username>/memory-2026:latest
  build-memory-2026:
    runs-on: self-hosted
    needs: test-memory-2026
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        shell: powershell
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026:latest .

  # 4.3 — PUSH : pousser sur Docker Hub
  push-memory-2026:
    runs-on: self-hosted
    needs: build-memory-2026
    steps:
      - name: Docker login
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
      - name: Docker push
        shell: powershell
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026:latest

  # 4.4 — DEPLOY : SSH vers TA machine, pull et run en 80:80
  deploy-memory-2026:
    runs-on: self-hosted
    needs: push-memory-2026
    steps:
      - name: Setup SSH key (Windows)
        shell: powershell
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force "$HOME\.ssh" | Out-Null
          Set-Content -Path "$HOME\.ssh\id_rsa" -Value $env:SSH_PRIVATE_KEY -NoNewline
          icacls "$HOME\.ssh\id_rsa" /inheritance:r /grant:r "$env:USERNAME:(R)" | Out-Null
      - name: Deploy to target via SSH
        shell: powershell
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/memory-2026:latest"
          # attention à `$null` côté distant → on l'échappe
          $remote = "docker pull $image; docker stop memory-2026 *> `$null; docker rm memory-2026 *> `$null; docker run -d --name memory-2026 -p 80:80 $image"
          ssh -o StrictHostKeyChecking=no "$env:SSH_USER@$env:SSH_HOST" "$remote"
